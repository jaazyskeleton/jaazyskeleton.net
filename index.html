<!DOCTYPE html>
<html>
<head>
    <style>
        .icon {
            transition: transform 0.2s ease;
        }
        .icon:hover {
            transform: scale(1.12);
        }
        body {
            margin-left: 80px;
        }
        
        a.button {
            height: 18px;
            padding: 2px 8px;
            border: 1px solid #F3F3F3;
            -moz-box-shadow: 0 0 0 1px #707070;
            -webkit-box-shadow: 0 0 0 1px #707070;
            box-shadow: 0 0 0 1px #707070;
            -moz-border-radius: 3px;
            -webkit-border-radius: 3px;
            border-radius: 3px;
            text-align: center;
            background: -moz-linear-gradient(top, #F2F2F2 0%, #EBEBEB 50%, #DDDDDD 51%, #CFCFCF 100%);
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0,#F2F2F2), color-stop(0.5,#EBEBEB),color-stop(0.51,#DDDDDD),color-stop(1,#CFCFCF));
            background: linear-gradient(top, #F2F2F2 0%, #EBEBEB 50%, #DDDDDD 51%, #CFCFCF 100%);
            font: normal 12px sans-serif;
            color: black;
            text-decoration: none;
        }
        a.button:hover {
            border: 1px solid #ECF7FD;
            -moz-box-shadow: 0 0 0 1px #3C7FB1;
            -webkit-box-shadow: 0 0 0 1px #3C7FB1;
            box-shadow: 0 0 0 1px #3C7FB1;
            background: -moz-linear-gradient(top, #EAF6FD 0%, #D9F0FC 50%, #BEE6FD 51%, #A7D9F5 100%);
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0,#EAF6FD), color-stop(0.5,#D9F0FC),color-stop(0.51,#BEE6FD),color-stop(1,#A7D9F5));
            background: linear-gradient(top, #EAF6FD 0%, #D9F0FC 50%, #BEE6FD 51%, #A7D9F5 100%);
        }
        a.button:active {
            padding: 2px 7px 3px 9px;
            border: 1px solid #73A7C4;
            border-bottom: 0;
            -moz-box-shadow: 0 0 0 1px #2C628B;
            -webkit-box-shadow: 0 0 0 1px #2C628B;
            box-shadow: 0 0 0 1px #2C628B;
            background: -moz-linear-gradient(top, #E5F4FC 0%, #C4E5F6 50%, #98D1EF 51%, #68B3DB 100%);
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0,#E5F4FC), color-stop(0.5,#C4E5F6),color-stop(0.51,#98D1EF),color-stop(1,#68B3DB));
        }

        @keyframes shake {
                    0%, 100% { transform: translateX(0); }
                    25% { transform: translateX(-10px); }
                    75% { transform: translateX(10px); }
                }
    </style>
    <title>Home</title>
    <link rel="icon" type="image/x-icon" href="Assets/Icons/Icon.png">
</head>

<body style="width:100%; background-color: azure; height:100vh; margin:0; padding:0; padding-top: 40px; background-size:cover; background-attachment:fixed;">

    <div style="width:100%; background-color:#ff525200; max-width:900px; margin:0 auto; padding:20px; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <b style="color:rgb(0, 0, 0); font-family: Segoe UI, Tahoma, sans-serif; text-align:center; font-size:65px;">
            jaazyskeleton.net
        </b>
        <i style="color:rgb(0, 0, 0); font-family: Segoe UI, Tahoma, sans-serif; text-align:center; font-size:20px;">
            this is my website.
        </i>

        <div style="position: relative; display: inline-block;">
            <img
                src="Assets/Screen.png"
                width="625"
                height="500"
                style="
                    display: block;
                    position: relative;
                    z-index: 1;
                "
            >

            <img
                src="Assets/Screen_Effect.png"
                style="
                    position: absolute;
                    top: 115px;
                    left: 90px;
                    width: 450px;
                    height: 300px;
                    pointer-events: none;
                    z-index: 3;
                "
            >

            <div style="
                position: absolute;
                top: 45%;
                left: 45%;
                display: flex;
                flex-direction: column;
                gap: 10px;
                z-index: 2;
            ">
                <a class="button" href="https://www.jaazyskeleton.net/updates"
                style="font-size: 12px; font-family: Segoe UI, Tahoma, sans-serif;">
                Updates
                </a>

                <a class="button" href="https://www.jaaszszkeleton.net/news"
                style="font-size: 12px; font-family: Segoe UI, sans-serif;">
                News
                </a>

                <a class="button" href="https://www.jaaszszkeleton.net/portfolio"
                style="font-size: 12px; font-family: Segoe UI, Tahoma, sans-serif;">
                Portfolio
                </a>
            </div>

            <div style="
                position: absolute;
                top: 67.5%;
                left: 33.25%;
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 20px;
                z-index: 2;
            ">
            <a href="https://www.reddit.com/r/jaazyskeleton/" style="text-decoration:none;">
                <img class="icon" src="Assets/Icons/Reddit.png" width="50" height="50" alt="Reddit">
            </a>
            <a style="text-decoration:none;" onclick="shakeDisapproval(event)">
                <img class="icon" src="Assets/Icons/Discord.png" width="75" height="75" alt="Discord" id="discord-icon">
            </a>
            <script>
                function shakeDisapproval(event) {
                    const icon = event.target;
                    icon.style.animation = 'none';
                    icon.style.cursor = 'not-allowed';
                    setTimeout(() => {
                        icon.style.animation = 'shake 0.5s';
                    }, 10);
                    
                    setTimeout(() => {
                        icon.style.cursor = 'pointer';
                    }, 500);
                    
                    const audio = new Audio('Assets/Sounds/vox-denied.mp3');
                    audio.play();
                }
            </script>

            <a href="https://www.youtube.com/@jaazyskeleton" style="text-decoration:none;">
                <img class="icon" src="Assets/Icons/Youtube.png" width="60" height="40" alt="Youtube">
            </a>
        </div>
        </div>
    </div>
</body>
</html>
